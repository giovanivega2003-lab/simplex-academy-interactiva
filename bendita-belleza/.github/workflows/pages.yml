# Publicar el sitio en GitHub Pages usando GitHub Actions.
#
# Este flujo NO se ejecuta solo. Solo corre cuando lo lanzás a mano desde la
# pestaña Actions ("Run workflow"), porque la forma simple de publicar es
# Settings -> Pages -> Deploy from a branch -> main / (root), y ahí este
# archivo no hace falta.
#
# Si lo lanzás, él mismo activa Pages con Actions como origen.
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
